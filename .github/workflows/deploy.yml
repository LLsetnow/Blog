name: Deploy to Alibaba Cloud ECS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Setup fetch credentials
        run: echo "${{ secrets.BILIBILI_COOKIES }}" > cookies.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to ECS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/blog/

      - name: Delete old artifacts (keep last 3)
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理旧artifact，保留最近3个..."
          gh api /repos/\${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id' | while read id; do
            if [ -n "\$id" ]; then
              echo "删除 artifact: \$id"
              gh api -X DELETE /repos/\${{ github.repository }}/actions/artifacts/\$id --silent
            fi
          done
          echo "清理完成！"
