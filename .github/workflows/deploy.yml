name: Deploy to Alibaba Cloud ECS
on:
  push:
    branches: [main]

# Deploy 用 rsync --delete 同步整个 /var/www/blog/，并发运行会互相删对方的产物。
# 串行排队而非取消：每个 commit 都要真正部署到，取消会让先合并的改动丢失。
concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只读代码；actions: write 供末尾的 artifact 清理步骤删除旧产物
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BLOG_EDITOR_PASSWORD: ${{ secrets.VITE_BLOG_EDITOR_PASSWORD }}
      - name: Deploy to ECS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          # AstrBot systemd timers 管理新闻、项目和收藏数据，部署时保留这些文件。
          # 不保留组，避免部署用户无权修改定时器管理目录的组。
          rsync -rloDzvc --delete \
            --exclude='news/today.json' \
            --exclude='projects-data/projects.json' \
            --exclude='projects-data/images/' \
            --exclude='bilibili-fav/favorites.json' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/blog/

      - name: Delete old artifacts (keep last 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理旧artifact，保留最近3个..."
          gh api /repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id' | while read id; do
            if [ -n "$id" ]; then
              echo "删除 artifact: $id"
              gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$id --silent
            fi
          done
          echo "清理完成！"
