name: Daily News Fetch & Deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# 本 workflow 自带 rsync --delete 部署步骤，与 deploy.yml 目标目录相同，
# 因此共用同一个并发组，避免两者同时同步 /var/www/blog/。
concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ssh-key 让后续 git push 走 deploy key（main 分支保护对 Deploy keys 豁免）
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.NEWS_BOT_DEPLOY_KEY }}

      - name: Checkout OPC repo
        uses: actions/checkout@v4
        with:
          repository: LLsetnow/OPC
          path: opc-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install opc CLI
        run: pip install -e opc-src/

      - run: npm ci

      - name: Setup fetch credentials
        run: echo "${{ secrets.BILIBILI_COOKIES }}" > cookies.txt

      - name: Run fetch-news script
        run: node tools/fetch-news.mjs
        timeout-minutes: 5
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit news data to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/news/today.json
          if git diff --cached --quiet; then
            echo "No news changes to commit"
          else
            git commit -m "chore: update daily news data"
            git push
          fi

      - name: Deploy to ECS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/blog/

      - name: Delete old artifacts (keep last 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理旧artifact，保留最近3个..."
          gh api /repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts | sort_by(.created_at) | reverse | .[3:] | .[].id' | while read id; do
            if [ -n "$id" ]; then
              echo "删除 artifact: $id"
              gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/$id --silent
            fi
          done
          echo "清理完成！"
