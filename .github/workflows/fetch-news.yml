name: Daily News Fetch & Deploy

on:
  schedule:
    # 3 PM Beijing time (UTC+8) = 7 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch:       # Allow manual trigger

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OPC repo
        uses: actions/checkout@v4
        with:
          repository: LLsetnow/OPC
          path: opc-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install opc CLI
        run: pip install -e opc-src/

      - run: npm ci

      - name: Setup fetch credentials
        run: echo "${{ secrets.BILIBILI_COOKIES }}" > cookies.txt

      - name: Run fetch-news script
        run: node tools/fetch-news.mjs
        timeout-minutes: 5
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to ECS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/blog/
